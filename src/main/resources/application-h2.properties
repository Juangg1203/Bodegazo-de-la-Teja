####################################################################
# PERFIL TEMPORAL: H2 EN MEMORIA (sin PostgreSQL)
# Activar con: -Dspring.profiles.active=h2
#
# Se usa SOLO para probar el sitio mientras se configura PostgreSQL.
# La base de datos se crea automáticamente en memoria al arrancar y
# se destruye al apagar la aplicación — no guarda nada entre
# ejecuciones. NO usar en producción.
####################################################################

spring.datasource.url=jdbc:h2:mem:bodegazo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas automáticamente a partir de las entidades
# (no requiere correr database/schema.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Carga datos de ejemplo (roles, usuario admin, productos) después de
# que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-h2.sql

# Consola web de H2, útil para inspeccionar los datos de prueba en
# el navegador: http://localhost:8080/h2-console
# JDBC URL a usar ahí: jdbc:h2:mem:bodegazo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.bodegazo.ferreteria=DEBUG
