####################################################################
# PERFIL: PRODUCCION (Render)
#
# IMPORTANTE: DB_URL debe incluir ?currentSchema=bodegazo al final,
# porque las tablas viven en ese esquema, no en "public". Ejemplo:
#   jdbc:postgresql://<host-interno>:5432/<basedatos>?currentSchema=bodegazo
####################################################################

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
# "validate" en vez de "update": las tablas ya se crean con schema.sql,
# así que Hibernate solo verifica que coincidan (mucho más rápido en el
# arranque que "update", que intenta comparar y alterar cada columna).
spring.jpa.hibernate.ddl-auto=validate

server.error.include-stacktrace=never
server.error.include-message=never

logging.level.root=WARN
logging.level.com.bodegazo.ferreteria=INFO