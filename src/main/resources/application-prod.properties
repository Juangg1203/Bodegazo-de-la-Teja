####################################################################
# PERFIL: PRODUCCION (Render)
# Activo automaticamente por ENV SPRING_PROFILES_ACTIVE=prod (Dockerfile).
#
# IMPORTANTE: la variable de entorno DB_URL en Render debe incluir
# ?currentSchema=bodegazo al final, porque las tablas viven en ese
# esquema, no en "public". Ejemplo:
#   jdbc:postgresql://<host-interno>:5432/<basedatos>?currentSchema=bodegazo
####################################################################

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

server.error.include-stacktrace=never
server.error.include-message=never

logging.level.root=WARN
logging.level.com.bodegazo.ferreteria=INFO
