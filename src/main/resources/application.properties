####################################################################
# APLICACION
####################################################################

# =====================================================================
# TEMPORAL: activa el perfil H2 (base de datos en memoria de prueba)
# sin necesidad de configurar Run Configurations en Eclipse.
# Para volver a PostgreSQL: borra o comenta esta línea y usa el perfil
# "dev" (ver application-dev.properties) o "prod".
# =====================================================================
spring.profiles.active=dev

spring.application.name=ferreteria-sistema
server.port=${PORT:8080}
server.servlet.context-path=/

####################################################################
# BASE DE DATOS - POSTGRESQL
# Las credenciales se toman de variables de entorno (ver .env / Render)
####################################################################
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bodegazo_teja}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=FerreteriaHikariPool

####################################################################
# JPA / HIBERNATE
# validate: el esquema lo administra database/schema.sql (no DDL automático en producción)
####################################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Ejecutar schema.sql / data.sql manualmente cuando se requiera (desactivado por defecto)
spring.sql.init.mode=never

####################################################################
# VISTAS - JSP
####################################################################
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/,/css/,/js/,/images/

####################################################################
# INTERNACIONALIZACION
####################################################################
spring.messages.basename=messages
spring.messages.encoding=UTF-8

####################################################################
# MULTIPART - CARGA DE ARCHIVOS (imagenes de productos, fichas PDF)
####################################################################
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.uploads.dir=${UPLOADS_DIR:src/main/webapp/uploads}

####################################################################
# SEGURIDAD - JWT/SESSION SECRET (usado por SecurityConfig / utils)
####################################################################
app.security.remember-me-key=${REMEMBER_ME_KEY:cambiar-esta-clave-en-produccion}

####################################################################
# CORREO (envio de cotizaciones)
####################################################################
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

####################################################################
# LOGGING
####################################################################
logging.level.root=INFO
logging.level.com.bodegazo.ferreteria=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %5p - %logger{36} - %msg%n

####################################################################
# THYMELEAF DESACTIVADO (usamos JSP como motor de vistas)
####################################################################
spring.thymeleaf.enabled=false
