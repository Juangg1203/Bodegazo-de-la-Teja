spring.application.name=ferreteria-sistema

# Por defecto usa "dev" (para que Eclipse/local funcione sin configurar nada).
# El Dockerfile fija SPRING_PROFILES_ACTIVE=prod como variable de entorno,
# que tiene prioridad sobre esta linea cuando corre en Render.
spring.profiles.active=dev

server.port=${PORT:8080}
server.servlet.context-path=/

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

spring.thymeleaf.enabled=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Carpeta donde se guardan las imagenes subidas de productos.
# En Render, el Dockerfile define UPLOADS_DIR=/app/uploads.
app.uploads.dir=${UPLOADS_DIR:src/main/webapp/uploads}

logging.level.root=INFO
logging.level.com.bodegazo.ferreteria=DEBUG
