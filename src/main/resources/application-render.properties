####################################################################
# PERFIL: RENDER TEMPORAL (H2 en memoria)
#
# Se usa mientras conectar a PostgreSQL en Render tarde demasiado para
# el limite de tiempo de deteccion de puerto. Los datos se regeneran
# solos en cada arranque (no persisten). Para volver a PostgreSQL real,
# cambiar SPRING_PROFILES_ACTIVE=prod en el Dockerfile o en Render.
####################################################################

spring.datasource.url=jdbc:h2:mem:bodegazo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-render.sql

server.error.include-stacktrace=never
server.error.include-message=never

logging.level.root=WARN
logging.level.com.bodegazo.ferreteria=INFO
